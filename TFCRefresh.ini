[General]
; Refresh the player's model automatically when gear is equipped/unequipped
; while in free camera (tfc). 1 = on, 0 = off.
bAutoRefreshOnEquip=1

; Optional manual refresh key (DirectInput scancode, decimal), only active in
; free camera. Useful for changes that aren't equip events (overlays, morphs).
; 0 = off. Examples: 199 = Home, 207 = End, 210 = Insert, 88 = F12.
iHotkey=0

; Wait this long after the last equip event before refreshing, so a full strip
; (many items at once) causes a single refresh.
iDebounceMs=250

; How long free camera is left during the refresh. Raise it if the model
; sometimes still doesn't update; lower it if the blink is too noticeable.
iGapMs=50
